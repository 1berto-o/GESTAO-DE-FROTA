upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads de CNH / vistorias / fotos (alinhado ao limite do Django).
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # API REST — URI completa preservada (sem barra no final do proxy_pass).
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        # $http_host preserva a porta pública (ex.: 127.0.0.1:8080).
        # $host omite a porta e o Django gera URLs de mídia em :80.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
    }

    # Arquivos estáticos do Django (collectstatic → volume staticfiles)
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Uploads: NÃO servir do disco pelo Nginx.
    # Proxy para o Django, que exige JWT ou token assinado de curta duração.
    location /media/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store";
    }

    # SPA React — fallback para o React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
